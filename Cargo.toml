[package]
name = "easyboard"
version = "0.3.0"
edition = "2021"
authors = ["MrRedstonia <contact@mrredstonia.com>"]
description = "EasyBoard - a cross-platform soundboard with a virtual microphone input"
license = "MIT"
repository = "https://github.com/MrRedstonia/EasyBoard"
readme = "README.md"
build = "build.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["full"] }

# audio decoding (mp3, flac, ogg/vorbis, wav, aac, m4a/alac, ...)
symphonia = { version = "0.5", features = ["all"] }

# app plumbing
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
rand = "0.8"
parking_lot = "0.12"
global-hotkey = "0.6"
ureq = { version = "2", features = ["json"] }
interprocess = "2"
log = "0.4"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
# themes: theme.xml and theme zip files
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }
cc = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "MrRedstonia <contact@mrredstonia.com>"
depends = "$auto, pulseaudio-utils | pipewire-pulse"
assets = [
    ["target/release/easyboard", "usr/bin/", "755"],
    ["packaging/easyboard.desktop", "usr/share/applications/", "644"],
    ["assets/app_icon.png", "usr/share/icons/hicolor/512x512/apps/easyboard.png", "644"],
]
